<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Reservation</title>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background-color: #1c1c1c;
      border-radius: 12px;
      padding: 20px;
    }

    a {
      color: orange;
      text-decoration: none;
    }
  </style>
</head>
<body>
<form th:action="@{/reservations/create}" method="post">
  <input type="hidden" name="showId" th:value="${show.id}">

  <label>Customer name:</label>
  <input type="text" name="customerName" required>

  <label>Row number:</label>
  <input type="number" name="rowNumber" min="1" required>

  <label>Seat number:</label>
  <input type="number" name="seatNumber" min="1" required>

  <button type="submit">Confirm reservation</button>
</form>
<div class="box">
  <h1>Book reservation</h1>

  <p><strong>Movie:</strong> <span th:text="${show.movie.title}">Movie title</span></p>
  <p><strong>Show time:</strong> <span th:text="${show.showTime}">2026-03-16T19:30</span></p>
  <p><strong>Hall:</strong> <span th:text="${show.hallName}">Hall 1</span></p>

  <br>
  <a th:href="@{/movies/{id}(id=${show.movie.id})}">← Back to movie</a>
</div>

</body>
</html>
