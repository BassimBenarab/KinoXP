<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>All Reservations</title>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    h1 {
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    th {
      background-color: #222;
      color: orange;
    }

    tr:hover {
      background-color: #2a2a2a;
    }

    a {
      color: orange;
      text-decoration: none;
    }

    .empty-message {
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 10px;
      color: #ccc;
    }
  </style>
</head>
<body>

<h1>All Reservations</h1>

<div th:if="${#lists.isEmpty(reservations)}" class="empty-message">
  No reservations found.
</div>

<table th:if="${not #lists.isEmpty(reservations)}">
  <thead>
  <tr>
    <th>ID</th>
    <th>Customer</th>
    <th>Movie</th>
    <th>Show Time</th>
    <th>Hall</th>
    <th>Row</th>
    <th>Seat</th>
    <th>Price</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="reservation : ${reservations}">
    <td th:text="${reservation.id}">1</td>
    <td th:text="${reservation.customerName}">Laman</td>
    <td th:text="${reservation.show.movie.title}">Avatar</td>
    <td th:text="${reservation.show.showTime}">2026-03-16T19:30</td>
    <td th:text="${reservation.show.hallName}">Hall 1</td>
    <td th:text="${reservation.rowNumber}">1</td>
    <td th:text="${reservation.seatNumber}">1</td>
    <td th:text="${reservation.price} + ' kr'">80 kr</td>
  </tr>
  </tbody>
</table>

<br>
<a th:href="@{/}">← Back to front page</a>

</body>
</html>
