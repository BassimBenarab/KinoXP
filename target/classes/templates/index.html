<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KinoXP</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding-top: 30px;
        }

        h2 {
            margin-left: 30px;
        }

        .movie-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, 200px);
            gap: 20px;
            padding: 30px;
        }

        .movie-card {
            width: 200px;
            background-color: #1c1c1c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            border: 3px solid antiquewhite;
        }

        .movie-info {
            padding: 12px;
            text-align: center;
        }

        .movie-info a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .movie-info a:hover {
            color: orange;
        }

        .movie-info p {
            margin: 8px 0 0 0;
            color: #ccc;
            font-size: 14px;
        }
        .admin-btn {
            display: inline-block;
            background-color: orange;
            color: black;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .admin-btn:hover {
            background-color: #ffb733;
        }
    </style>
</head>
<body>

<h1>Velkommen til KinoXP</h1>
<h2>Movies in Theaters</h2>

<div class="movie-card" th:each="movie : ${movies}">
    <a th:href="@{/movies/{id}(id=${movie.id})}">
        <img th:src="@{${movie.imageUrl}}" alt="Movie Poster">
    </a>

    <div class="movie-info">
        <a th:href="@{/movies/{id}(id=${movie.id})}"
           th:text="${movie.title}">Movie Title</a>

        <p th:text="${movie.genre}">Genre</p>
        <p th:text="${movie.durationMinutes} + ' min'">120 min</p>
    </div>

</div>
<div style="text-align: center; margin-bottom: 20px;">
    <a th:href="@{/admin/reservations}"
       style="background-color: orange; color: black; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold;">
        Admin
    </a>
</div>


</body>
</html>
